name: Build and deploy Sotaku sticker site

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      # Official upstream sticker source repo (categories of images).
      # Images are never copied into the deployment: they are served via jsDelivr CDN.
      - name: Checkout upstream ChineseBQB
        uses: actions/checkout@v4
        with:
          repository: zhaoolee/ChineseBQB
          ref: master
          path: bqb-src
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image tools
        run: python -m pip install Pillow

      - name: Install Hugo
        run: |
          HUGO_VERSION=0.162.1
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/hugo.tar.gz" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir -p "$RUNNER_TEMP/hugo-bin"
          tar -xzf "$RUNNER_TEMP/hugo.tar.gz" -C "$RUNNER_TEMP/hugo-bin" hugo
          echo "$RUNNER_TEMP/hugo-bin" >> "$GITHUB_PATH"

      - name: Restore thumbnails cache
        uses: actions/cache@v4
        with:
          path: bqb-src/.hugo-cache
          key: bqb-thumbs-${{ runner.os }}-${{ github.sha }}
          restore-keys: bqb-thumbs-${{ runner.os }}-

      - name: Apply Sotaku site config
        run: |
          cp hugo.toml bqb-src/hugo.toml
          rm -rf bqb-src/site
          cp -R site bqb-src/site
          cp scripts/build_site.py bqb-src/scripts/build_site.py

      - name: Generate and build site
        working-directory: bqb-src
        run: python scripts/build_site.py build

      - name: Verify no media originals leaked into the artifact
        run: |
          if [ -d public-hugo/media ] || [ -d bqb-src/public-hugo/media ]; then echo "media dir should not exist"; exit 1; fi
          du -sh bqb-src/public-hugo

      - name: Deploy to Cloudflare Pages
        run: npx wrangler@3 pages deploy "bqb-src/public-hugo" --project-name sticker --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
